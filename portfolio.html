  <style>

    /* ==========================================================
       BASIC
       ========================================================== */

    :root {
      --bg: #f6f5f1;
      --ink: #222;
      --muted: #8c8c8c;
      --paper: #fff;

      --shadow:
        0 26px 80px rgba(0,0,0,0.16),
        0 8px 22px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);

      background-image:
        url("https://www.transparenttextures.com/patterns/white-paper.png");

      color: var(--ink);

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      text-rendering: optimizeLegibility;

      touch-action: manipulation;
    }


    /* ==========================================================
       TOP BAR
       ========================================================== */

    .topbar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 18px 24px;

      pointer-events: none;
    }

    .topbar a,
    .topbar .meta {

      pointer-events: auto;

      text-decoration: none;

      font-size: 13px;

      letter-spacing: 0.08em;

      color: #444;
    }

    .meta {

      color: var(--muted);

      font-variant-numeric: tabular-nums;
    }


    /* ==========================================================
       STAGE
       ========================================================== */

    .stage {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        72px
        18px
        102px;

      perspective: 2600px;
    }


    /* ==========================================================
       BOOK
       ========================================================== */

    .book {

      position: relative;

      filter: drop-shadow(var(--shadow));

      transition:
        width .35s ease,
        height .35s ease;

      user-select: none;
    }


    /*
     * A4 단독 페이지
     *
     * page-01
     * page-44
     */

    .book.single-mode {

      width:
        min(
          88vw,
          calc((100vh - 180px) * 0.707)
        );

      height:
        min(
          78vh,
          calc((100vw - 36px) / 0.707)
        );

      max-width: 595px;

      max-height: 842px;
    }


    /*
     * 2페이지 펼침
     *
     * page-02 | page-03
     * page-04 | page-05
     * ...
     * page-42 | page-43
     */

    .book.spread-mode {

      width:
        min(
          94vw,
          calc((100vh - 190px) * 1.414)
        );

      height:
        min(
          76vh,
          calc((100vw - 36px) / 1.414)
        );

      max-width: 1190px;

      max-height: 842px;
    }


    .single-frame,
    .spread-frame {

      position: absolute;

      inset: 0;
    }

    .hidden {
      display: none !important;
    }


    /* ==========================================================
       SHEET
       ========================================================== */

    .sheet {

      position: absolute;

      top: 0;
      bottom: 0;

      background: var(--paper);

      overflow: hidden;

      backface-visibility: hidden;
    }

    .sheet img {

      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #fff;

      pointer-events: none;

      -webkit-user-drag: none;
    }


    /* ==========================================================
       SINGLE PAGE
       ========================================================== */

    .single-sheet {

      inset: 0;

      box-shadow: var(--shadow);
    }


    /* ==========================================================
       TWO PAGE SPREAD
       ========================================================== */

    .left-page,
    .right-page {

      width: 50%;

      box-shadow:
        0 14px 32px rgba(0,0,0,0.08);
    }

    .left-page {
      left: 0;
    }

    .right-page {
      right: 0;
    }


    /* ==========================================================
       CENTER / GUTTER
       ========================================================== */

    .spread-frame::before {

      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 50%;

      transform:
        translateX(-50%);

      width: 54px;

      background:
        linear-gradient(
          to right,

          rgba(0,0,0,0),

          rgba(0,0,0,0.12) 20%,

          rgba(0,0,0,0.20) 50%,

          rgba(0,0,0,0.12) 80%,

          rgba(0,0,0,0)
        );

      filter: blur(9px);

      z-index: 8;

      pointer-events: none;
    }

    .spread-frame::after {

      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 50%;

      transform:
        translateX(-50%);

      width: 1px;

      background:
        linear-gradient(
          to bottom,

          rgba(255,255,255,0.95),

          rgba(80,80,80,0.38) 10%,

          rgba(55,55,55,0.5) 50%,

          rgba(80,80,80,0.38) 90%,

          rgba(255,255,255,0.95)
        );

      box-shadow:
        -9px 0 18px rgba(0,0,0,0.08),
        9px 0 18px rgba(0,0,0,0.08);

      z-index: 9;

      pointer-events: none;
    }


    /* ==========================================================
       PAGE FLIP
       ========================================================== */

    .flip-layer {

      position: absolute;

      top: 0;

      width: 50%;
      height: 100%;

      z-index: 20;

      pointer-events: none;

      transform-style: preserve-3d;

      display: none;
    }

    .flip-layer.active {
      display: block;
    }

    .flip-layer.next {

      right: 0;

      transform-origin:
        left center;
    }

    .flip-layer.prev {

      left: 0;

      transform-origin:
        right center;
    }

    .flip-face {

      position: absolute;

      inset: 0;

      background: var(--paper);

      backface-visibility: hidden;

      overflow: hidden;

      box-shadow:
        0 18px 36px rgba(0,0,0,0.18);
    }

    .flip-face img {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      pointer-events: none;
    }

    .flip-face.back {

      transform:
        rotateY(180deg);
    }

    .flip-layer.next.active {

      animation:
        flipNext
        0.9s
        cubic-bezier(.45,.08,.2,1)
        forwards;
    }

    .flip-layer.prev.active {

      animation:
        flipPrev
        0.9s
        cubic-bezier(.45,.08,.2,1)
        forwards;
    }

    @keyframes flipNext {

      from {
        transform:
          rotateY(0deg);
      }

      to {
        transform:
          rotateY(-180deg);
      }
    }

    @keyframes flipPrev {

      from {
        transform:
          rotateY(0deg);
      }

      to {
        transform:
          rotateY(180deg);
      }
    }


    /* ==========================================================
       DESKTOP NAVIGATION
       ========================================================== */

    .desktop-zones {

      position: fixed;

      inset: 0;

      z-index: 30;

      pointer-events: none;
    }

    .zone {

      position: absolute;

      top: 0;
      bottom: 0;

      width: 28vw;

      min-width: 120px;

      display: flex;

      align-items: center;
      justify-content: center;

      opacity: 0;

      transition:
        opacity .2s ease;

      pointer-events: auto;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .zone:hover {
      opacity: 1;
    }

    .zone.left {
      left: 0;
    }

    .zone.right {
      right: 0;
    }

    .zone span {

      width: 56px;
      height: 56px;

      border-radius: 999px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 34px;

      color: #444;

      background:
        rgba(255,255,255,0.78);

      backdrop-filter:
        blur(6px);

      box-shadow:
        0 8px 24px rgba(0,0,0,0.12);
    }


    /* ==========================================================
       MOBILE BUTTONS
       ========================================================== */

    .mobile-controls {
      display: none;
    }

    .mobile-controls button {

      border:
        1px solid rgba(34,34,34,0.14);

      background:
        rgba(255,255,255,0.95);

      color: #222;

      border-radius: 999px;

      padding:
        14px
        20px;

      min-width: 136px;

      font-size: 13px;

      letter-spacing: 0.08em;

      box-shadow:
        0 10px 26px rgba(0,0,0,0.10);

      -webkit-tap-highlight-color:
        transparent;
    }

    .mobile-controls button:active {

      transform:
        translateY(1px)
        scale(0.99);
    }


    /* ==========================================================
       HINT
       ========================================================== */

    .hint {

      position: fixed;

      left: 50%;

      bottom: 24px;

      transform:
        translateX(-50%);

      z-index: 40;

      font-size: 12px;

      letter-spacing: 0.08em;

      color: var(--muted);

      pointer-events: none;

      animation:
        fadeOut
        5.5s
        ease
        forwards;

      animation-delay: 4s;
    }

    @keyframes fadeOut {

      to {
        opacity: 0;
      }
    }


    /* ==========================================================
       MOBILE
       ========================================================== */

    @media (max-width: 900px) {

      .stage {

        padding:
          58px
          8px
          105px;
      }


      /*
       * 모바일에서도 펼침 유지
       *
       * page-02 | page-03
       * page-04 | page-05
       * ...
       */

      .book.spread-mode {

        width:
          min(
            96vw,
            calc((100vh - 170px) * 1.414)
          );

        height:
          min(
            68vh,
            calc((100vw - 16px) / 1.414)
          );

        max-width: 1190px;

        max-height: 842px;
      }


      /*
       * 모바일 A4 단독
       */

      .book.single-mode {

        width:
          min(
            88vw,
            calc((100vh - 175px) * 0.707)
          );

        height:
          min(
            72vh,
            calc((100vw - 16px) / 0.707)
          );

        max-width: 595px;

        max-height: 842px;
      }


      /*
       * 중요:
       *
       * 기존 코드의
       *
       * .right-page {
       *   display: none;
       * }
       *
       * 를 완전히 제거했습니다.
       *
       * 따라서 모바일에서도
       * 양쪽 페이지가 모두 보입니다.
       */

      .left-page,
      .right-page {

        width: 50%;

        display: block;
      }


      /*
       * 모바일 중앙 책등
       */

      .spread-frame::before {

        width: 28px;

        filter: blur(5px);
      }

      .spread-frame::after {
        width: 1px;
      }


      /*
       * 모바일 flip
       */

      .flip-layer {
        width: 50%;
      }


      /*
       * 모바일 버튼
       */

      .mobile-controls {

        position: fixed;

        left: 12px;
        right: 12px;

        bottom: 14px;

        display: flex;

        justify-content:
          space-between;

        gap: 10px;

        z-index: 45;
      }

      .mobile-controls button {

        flex: 1;

        min-width: 0;

        padding:
          13px
          10px;

        font-size: 11px;

        white-space: nowrap;
      }


      /*
       * 모바일 hint
       */

      .hint {

        bottom: 68px;

        width:
          calc(100vw - 24px);

        text-align: center;

        font-size: 10px;
      }


      /*
       * 모바일 좌우 클릭 영역
       */

      .desktop-zones .zone {

        width: 24vw;

        min-width: 50px;
      }

      .zone span {

        width: 42px;
        height: 42px;

        font-size: 27px;
      }


      /*
       * 모바일 topbar
       */

      .topbar {

        padding:
          11px
          13px;
      }

      .topbar a,
      .topbar .meta {

        font-size: 11px;
      }
    }


    /* ==========================================================
       VERY SMALL MOBILE
       ========================================================== */

    @media (max-width: 420px) {

      .stage {

        padding:
          54px
          5px
          100px;
      }

      .book.spread-mode {

        width: 98vw;

        height:
          calc(98vw / 1.414);

        max-height:
          calc(100vh - 180px);
      }

      .book.single-mode {

        width: 88vw;

        height:
          calc(88vw / 0.707);

        max-height:
          calc(100vh - 180px);
      }

      .mobile-controls button {

        font-size: 10px;
      }
    }

  </style>

  <script>

    /* ==========================================================
       SETTINGS
       ========================================================== */

    /*
     * 총 페이지 수
     */

    const TOTAL_PAGES = 44;


    /*
     * 이미지 폴더
     */

    const FOLDER = 'pages/';


    /*
     * 이미지 파일 이름
     */

    const PREFIX = 'page-';


    /*
     * 이미지 확장자
     */

    const EXT = '.jpg';


    /*
     * 마지막 페이지는 A4 단독
     */

    const LAST_SINGLE_PAGE =
      TOTAL_PAGES;


    /* ==========================================================
       ELEMENTS
       ========================================================== */

    const book =
      document.getElementById('book');

    const singleFrame =
      document.getElementById('singleFrame');

    const spreadFrame =
      document.getElementById('spreadFrame');

    const singleImg =
      document.getElementById('singleImg');

    const leftImg =
      document.getElementById('leftImg');

    const rightImg =
      document.getElementById('rightImg');

    const pageCounter =
      document.getElementById('pageCounter');

    const flipNextLayer =
      document.getElementById('flipNextLayer');

    const flipPrevLayer =
      document.getElementById('flipPrevLayer');

    const flipNextFront =
      document.getElementById('flipNextFront');

    const flipNextBack =
      document.getElementById('flipNextBack');

    const flipPrevFront =
      document.getElementById('flipPrevFront');

    const flipPrevBack =
      document.getElementById('flipPrevBack');


    /* ==========================================================
       STATE
       ========================================================== */

    /*
     * 현재 위치
     *
     * 1
     * 2–3
     * 4–5
     * ...
     * 42–43
     * 44
     */

    let currentLeft = 1;

    let isAnimating = false;


    /* ==========================================================
       IMAGE PATH
       ========================================================== */

    function pageSrc(n) {

      return (
        FOLDER +
        PREFIX +
        String(n).padStart(2, '0') +
        EXT
      );

    }


    /* ==========================================================
       SINGLE PAGE
       ========================================================== */

    function isSinglePage() {

      return (
        currentLeft === 1 ||
        currentLeft === LAST_SINGLE_PAGE
      );

    }


    /* ==========================================================
       COUNTER
       ========================================================== */

    function setCounter() {

      /*
       * 첫 페이지
       */

      if (currentLeft === 1) {

        pageCounter.textContent =
          '1 / ' +
          TOTAL_PAGES;

        return;

      }


      /*
       * 마지막 페이지
       */

      if (
        currentLeft ===
        LAST_SINGLE_PAGE
      ) {

        pageCounter.textContent =
          LAST_SINGLE_PAGE +
          ' / ' +
          TOTAL_PAGES;

        return;

      }


      /*
       * 일반 펼침
       */

      const right =
        currentLeft + 1;


      pageCounter.textContent =
        currentLeft +
        '–' +
        right +
        ' / ' +
        TOTAL_PAGES;

    }


    /* ==========================================================
       RENDER
       ========================================================== */

    function render() {


      /*
       * ----------------------------------------
       * SINGLE A4
       * ----------------------------------------
       */

      if (isSinglePage()) {

        book.classList.remove(
          'spread-mode'
        );

        book.classList.add(
          'single-mode'
        );


        spreadFrame.classList.add(
          'hidden'
        );

        singleFrame.classList.remove(
          'hidden'
        );


        singleImg.src =
          pageSrc(currentLeft);

      }


      /*
       * ----------------------------------------
       * TWO PAGE SPREAD
       * ----------------------------------------
       */

      else {

        book.classList.remove(
          'single-mode'
        );

        book.classList.add(
          'spread-mode'
        );


        singleFrame.classList.add(
          'hidden'
        );

        spreadFrame.classList.remove(
          'hidden'
        );


        /*
         * LEFT
         */

        leftImg.src =
          pageSrc(currentLeft);


        /*
         * RIGHT
         */

        rightImg.src =
          pageSrc(
            currentLeft + 1
          );

      }


      setCounter();

    }


    /* ==========================================================
       NEXT TARGET
       ========================================================== */

    function nextTarget() {


      /*
       * 1 → 2–3
       */

      if (currentLeft === 1) {

        return 2;

      }


      /*
       * 42–43 → 44
       */

      if (
        currentLeft ===
        TOTAL_PAGES - 2
      ) {

        return LAST_SINGLE_PAGE;

      }


      /*
       * 44 → stop
       */

      if (
        currentLeft ===
        LAST_SINGLE_PAGE
      ) {

        return currentLeft;

      }


      /*
       * 일반
       */

      return currentLeft + 2;

    }


    /* ==========================================================
       PREVIOUS TARGET
       ========================================================== */

    function prevTarget() {


      /*
       * 1 → stop
       */

      if (currentLeft <= 1) {

        return 1;

      }


      /*
       * 44 → 42–43
       */

      if (
        currentLeft ===
        LAST_SINGLE_PAGE
      ) {

        return TOTAL_PAGES - 2;

      }


      /*
       * 2–3 → 1
       */

      if (currentLeft === 2) {

        return 1;

      }


      /*
       * 일반
       */

      return Math.max(
        2,
        currentLeft - 2
      );

    }


    /* ==========================================================
       DESKTOP NEXT FLIP
       ========================================================== */

    function animateNextDesktop(
      targetLeft
    ) {

      /*
       * 예:
       *
       * 42–43 → 44
       */

      flipNextFront.src =
        pageSrc(currentLeft + 1);


      flipNextBack.src =
        pageSrc(targetLeft);


      flipNextLayer.classList.remove(
        'active'
      );


      void flipNextLayer.offsetWidth;


      flipNextLayer.classList.add(
        'active'
      );


      setTimeout(() => {

        flipNextLayer.classList.remove(
          'active'
        );


        currentLeft =
          targetLeft;


        render();


        isAnimating = false;

      }, 900);

    }


    /* ==========================================================
       DESKTOP PREVIOUS FLIP
       ========================================================== */

    function animatePrevDesktop(
      targetLeft
    ) {

      /*
       * 44 → 42–43
       */

      if (
        currentLeft ===
        LAST_SINGLE_PAGE
      ) {

        flipPrevFront.src =
          pageSrc(
            LAST_SINGLE_PAGE
          );


        flipPrevBack.src =
          pageSrc(targetLeft);

      }


      /*
       * 일반
       */

      else {

        flipPrevFront.src =
          pageSrc(currentLeft);


        flipPrevBack.src =
          pageSrc(
            targetLeft + 1
          );

      }


      flipPrevLayer.classList.remove(
        'active'
      );


      void flipPrevLayer.offsetWidth;


      flipPrevLayer.classList.add(
        'active'
      );


      setTimeout(() => {

        flipPrevLayer.classList.remove(
          'active'
        );


        currentLeft =
          targetLeft;


        render();


        isAnimating = false;

      }, 900);

    }


    /* ==========================================================
       NEXT
       ========================================================== */

    function next() {

      if (isAnimating) {
        return;
      }


      const targetLeft =
        nextTarget();


      /*
       * 마지막이면 정지
       */

      if (
        targetLeft ===
        currentLeft
      ) {

        return;

      }


      isAnimating = true;


      /*
       * 모바일
       *
       * 데스크톱과 동일하게
       * 2페이지씩 이동
       */

      if (isMobile()) {

        currentLeft =
          targetLeft;


        render();


        isAnimating = false;


        return;

      }


      /*
       * 1 → 2–3
       */

      if (currentLeft === 1) {

        currentLeft = 2;


        render();


        isAnimating = false;


        return;

      }


      /*
       * 페이지 넘김
       */

      animateNextDesktop(
        targetLeft
      );

    }


    /* ==========================================================
       PREVIOUS
       ========================================================== */

    function prev() {

      if (isAnimating) {
        return;
      }


      const targetLeft =
        prevTarget();


      /*
       * 이미 첫 페이지면 정지
       */

      if (
        targetLeft ===
        currentLeft
      ) {

        return;

      }


      isAnimating = true;


      /*
       * 모바일
       */

      if (isMobile()) {

        currentLeft =
          targetLeft;


        render();


        isAnimating = false;


        return;

      }


      /*
       * 2–3 → 1
       */

      if (currentLeft === 2) {

        currentLeft = 1;


        render();


        isAnimating = false;


        return;

      }


      /*
       * 페이지 넘김
       */

      animatePrevDesktop(
        targetLeft
      );

    }


    /* ==========================================================
       MOBILE CHECK
       ========================================================== */

    function isMobile() {

      return window.innerWidth <= 900;

    }


    /* ==========================================================
       BUTTONS
       ========================================================== */

    document
      .getElementById('nextZone')
      .addEventListener(
        'click',
        next
      );


    document
      .getElementById('prevZone')
      .addEventListener(
        'click',
        prev
      );


    document
      .getElementById('nextButton')
      .addEventListener(
        'click',
        next
      );


    document
      .getElementById('prevButton')
      .addEventListener(
        'click',
        prev
      );


    /* ==========================================================
       KEYBOARD
       ========================================================== */

    document.addEventListener(
      'keydown',
      (e) => {

        if (
          e.key === 'ArrowRight' ||
          e.key === ' ' ||
          e.key === 'PageDown'
        ) {

          e.preventDefault();

          next();

        }


        else if (
          e.key === 'ArrowLeft' ||
          e.key === 'PageUp'
        ) {

          e.preventDefault();

          prev();

        }

      }
    );


    /* ==========================================================
       TOUCH / SWIPE
       ========================================================== */

    let touchStartX = null;
    let touchStartY = null;


    document.addEventListener(
      'touchstart',
      (e) => {

        touchStartX =
          e.changedTouches[0].screenX;


        touchStartY =
          e.changedTouches[0].screenY;

      },
      {
        passive: true
      }
    );


    document.addEventListener(
      'touchend',
      (e) => {

        if (
          touchStartX === null
        ) {

          return;

        }


        const dx =
          e.changedTouches[0].screenX -
          touchStartX;


        const dy =
          e.changedTouches[0].screenY -
          touchStartY;


        const threshold =
          isMobile()
            ? 24
            : 42;


        if (
          Math.abs(dx) > threshold &&
          Math.abs(dx) >
            Math.abs(dy) * 1.15
        ) {

          if (dx < 0) {

            next();

          }

          else {

            prev();

          }

        }


        touchStartX = null;

        touchStartY = null;

      },
      {
        passive: true
      }
    );


    /* ==========================================================
       RESIZE
       ========================================================== */

    let resizeTimer = null;


    window.addEventListener(
      'resize',
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            render,
            120
          );

      }
    );


    /* ==========================================================
       PRELOAD ALL PAGES
       ========================================================== */

    for (
      let i = 1;
      i <= TOTAL_PAGES;
      i++
    ) {

      const img =
        new Image();


      img.src =
        pageSrc(i);

    }


    /* ==========================================================
       INITIAL RENDER
       ========================================================== */

    render();

  </script>
