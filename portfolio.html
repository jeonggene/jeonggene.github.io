  <div class="hint">

  <script>
    /* ==============================================================
       EASY UPDATE

       pages/
       ├── page-01.jpg
       ├── page-02.jpg
       ├── ...
       ├── page-41.jpg
       └── page-42.jpg   ← 마지막 A4 단독 페이지

       TOTAL_PAGES 숫자만 실제 전체 페이지 수와 맞추면 됩니다.
       ============================================================== */

    const TOTAL_PAGES = 42;

    const FOLDER = 'pages/';
    const PREFIX = 'page-';
    const EXT = '.jpg';

    /* ==============================================================
       마지막 페이지 번호
       마지막 페이지는 항상 A4 단독 페이지로 표시됩니다.
       ============================================================== */

    const LAST_SINGLE_PAGE = TOTAL_PAGES;


    const book = document.getElementById('book');

    const singleFrame = document.getElementById('singleFrame');
    const spreadFrame = document.getElementById('spreadFrame');

    const singleImg = document.getElementById('singleImg');

    const leftImg = document.getElementById('leftImg');
    const rightImg = document.getElementById('rightImg');

    const pageCounter = document.getElementById('pageCounter');

    const flipNextLayer = document.getElementById('flipNextLayer');
    const flipPrevLayer = document.getElementById('flipPrevLayer');

    const flipNextFront = document.getElementById('flipNextFront');
    const flipNextBack = document.getElementById('flipNextBack');

    const flipPrevFront = document.getElementById('flipPrevFront');
    const flipPrevBack = document.getElementById('flipPrevBack');


    /*
     * 현재 화면의 왼쪽 페이지 번호.
     *
     * 1  = 첫 번째 단독 페이지
     * 2  = 2–3 펼침
     * 4  = 4–5 펼침
     * ...
     * 40 = 40–41 펼침
     * 42 = 마지막 단독 페이지
     */

    let currentLeft = 1;

    let isAnimating = false;


    function pageSrc(n) {
      return FOLDER + PREFIX + String(n).padStart(2, '0') + EXT;
    }


    function isMobile() {
      return window.innerWidth <= 900;
    }


    /*
     * 단독 페이지인지 판단
     *
     * 데스크톱:
     *   page 1
     *   page 42
     *
     * 모바일:
     *   모든 페이지가 한 장씩 표시되므로 항상 단독
     */

    function isSinglePage() {
      return (
        isMobile() ||
        currentLeft === 1 ||
        currentLeft === LAST_SINGLE_PAGE
      );
    }


    function setCounter() {

      if (isMobile()) {
        pageCounter.textContent =
          currentLeft + ' / ' + TOTAL_PAGES;

        return;
      }

      if (currentLeft === 1 || currentLeft === LAST_SINGLE_PAGE) {
        pageCounter.textContent =
          currentLeft + ' / ' + TOTAL_PAGES;

        return;
      }

      const right = Math.min(
        currentLeft + 1,
        TOTAL_PAGES
      );

      pageCounter.textContent =
        currentLeft + '–' + right + ' / ' + TOTAL_PAGES;
    }


    function render() {

      /*
       * 단독 페이지
       */

      if (isSinglePage()) {

        book.classList.remove('spread-mode');
        book.classList.add('single-mode');

        spreadFrame.classList.add('hidden');
        singleFrame.classList.remove('hidden');

        singleImg.src = pageSrc(currentLeft);

      }

      /*
       * 데스크톱 펼침
       */

      else {

        book.classList.remove('single-mode');
        book.classList.add('spread-mode');

        singleFrame.classList.add('hidden');
        spreadFrame.classList.remove('hidden');

        leftImg.src = pageSrc(currentLeft);

        rightImg.src =
          pageSrc(
            Math.min(
              currentLeft + 1,
              TOTAL_PAGES - 1
            )
          );
      }

      setCounter();
    }


    /*
     * 다음 페이지
     *
     * 1 → 2–3
     * 2–3 → 4–5
     * ...
     * 40–41 → 42
     */

    function nextTarget() {

      /*
       * 첫 페이지에서 펼침으로
       */

      if (currentLeft === 1) {
        return 2;
      }

      /*
       * 40–41 다음은 마지막 42
       */

      if (currentLeft === TOTAL_PAGES - 2) {
        return TOTAL_PAGES;
      }

      /*
       * 마지막 페이지에서는 정지
       */

      if (currentLeft === LAST_SINGLE_PAGE) {
        return currentLeft;
      }

      /*
       * 일반 펼침
       */

      return currentLeft + 2;
    }


    /*
     * 이전 페이지
     *
     * 42 → 40–41
     * 40–41 → 38–39
     * ...
     * 2–3 → 1
     */

    function prevTarget() {

      /*
       * 첫 페이지에서는 정지
       */

      if (currentLeft <= 1) {
        return 1;
      }

      /*
       * 마지막 단독 페이지에서
       * 바로 직전 펼침으로 돌아감
       */

      if (currentLeft === LAST_SINGLE_PAGE) {
        return Math.max(
          2,
          TOTAL_PAGES - 2
        );
      }

      /*
       * 첫 펼침에서 표지로
       */

      if (currentLeft === 2) {
        return 1;
      }

      /*
       * 일반 펼침
       */

      return Math.max(
        2,
        currentLeft - 2
      );
    }


    /*
     * 데스크톱 다음 페이지 넘김
     */

    function animateNextDesktop(targetLeft) {

      /*
       * 마지막 페이지로 넘어가는 경우
       *
       * 40–41 → 42
       *
       * 오른쪽 페이지가 넘어가면서
       * 마지막 단독 페이지가 나타나도록 구성
       */

      if (targetLeft === LAST_SINGLE_PAGE) {

        flipNextFront.src =
          pageSrc(currentLeft + 1);

        flipNextBack.src =
          pageSrc(LAST_SINGLE_PAGE);

      }

      else {

        flipNextFront.src =
          pageSrc(currentLeft + 1);

        flipNextBack.src =
          pageSrc(targetLeft);

      }

      flipNextLayer.classList.remove('active');

      void flipNextLayer.offsetWidth;

      flipNextLayer.classList.add('active');


      setTimeout(() => {

        flipNextLayer.classList.remove('active');

        currentLeft = targetLeft;

        render();

        isAnimating = false;

      }, 900);
    }


    /*
     * 데스크톱 이전 페이지 넘김
     */

    function animatePrevDesktop(targetLeft) {

      /*
       * 42 → 40–41
       *
       * 마지막 페이지에서 이전으로 돌아갈 때도
       * 자연스럽게 페이지가 넘어가도록 처리
       */

      if (currentLeft === LAST_SINGLE_PAGE) {

        flipPrevFront.src =
          pageSrc(LAST_SINGLE_PAGE);

        flipPrevBack.src =
          pageSrc(targetLeft);

      }

      else {

        flipPrevFront.src =
          pageSrc(currentLeft);

        flipPrevBack.src =
          pageSrc(targetLeft + 1);

      }

      flipPrevLayer.classList.remove('active');

      void flipPrevLayer.offsetWidth;

      flipPrevLayer.classList.add('active');


      setTimeout(() => {

        flipPrevLayer.classList.remove('active');

        currentLeft = targetLeft;

        render();

        isAnimating = false;

      }, 900);
    }


    function next() {

      if (isAnimating) return;

      const targetLeft = nextTarget();

      if (targetLeft === currentLeft) return;

      isAnimating = true;


      /*
       * 모바일
       * 한 페이지씩 이동
       */

      if (isMobile()) {

        currentLeft =
          Math.min(
            currentLeft + 1,
            TOTAL_PAGES
          );

        render();

        isAnimating = false;

        return;
      }


      /*
       * 데스크톱
       *
       * 1 → 2–3
       */

      if (currentLeft === 1) {

        currentLeft = 2;

        render();

        isAnimating = false;

        return;
      }


      /*
       * 펼침 → 다음 펼침 / 마지막 단독 페이지
       */

      animateNextDesktop(targetLeft);
    }


    function prev() {

      if (isAnimating) return;

      const targetLeft = prevTarget();

      if (targetLeft === currentLeft) return;

      isAnimating = true;


      /*
       * 모바일
       */

      if (isMobile()) {

        currentLeft =
          Math.max(
            1,
            currentLeft - 1
          );

        render();

        isAnimating = false;

        return;
      }


      /*
       * 2–3 → 1
       */

      if (currentLeft === 2) {

        currentLeft = 1;

        render();

        isAnimating = false;

        return;
      }


      /*
       * 42 → 40–41
       *
       * 또는 일반 펼침 이전 이동
       */

      animatePrevDesktop(targetLeft);
    }


    /*
     * 클릭
     */

    document
      .getElementById('nextZone')
      .addEventListener('click', next);

    document
      .getElementById('prevZone')
      .addEventListener('click', prev);

    document
      .getElementById('nextButton')
      .addEventListener('click', next);

    document
      .getElementById('prevButton')
      .addEventListener('click', prev);


    /*
     * 키보드
     */

    document.addEventListener('keydown', (e) => {

      if (
        e.key === 'ArrowRight' ||
        e.key === ' ' ||
        e.key === 'PageDown'
      ) {
        e.preventDefault();
        next();
      }

      else if (
        e.key === 'ArrowLeft' ||
        e.key === 'PageUp'
      ) {
        e.preventDefault();
        prev();
      }

    });


    /*
     * 터치 / 스와이프
     */

    let touchStartX = null;
    let touchStartY = null;


    document.addEventListener(
      'touchstart',
      (e) => {

        touchStartX =
          e.changedTouches[0].screenX;

        touchStartY =
          e.changedTouches[0].screenY;

      },
      { passive: true }
    );


    document.addEventListener(
      'touchend',
      (e) => {

        if (touchStartX === null) return;

        const dx =
          e.changedTouches[0].screenX -
          touchStartX;

        const dy =
          e.changedTouches[0].screenY -
          touchStartY;

        const threshold =
          isMobile() ? 24 : 42;


        if (
          Math.abs(dx) > threshold &&
          Math.abs(dx) >
            Math.abs(dy) * 1.15
        ) {

          if (dx < 0) {
            next();
          } else {
            prev();
          }

        }

        touchStartX = null;
        touchStartY = null;

      },
      { passive: true }
    );


    /*
     * 화면 크기 변경
     */

    let resizeTimer = null;

    window.addEventListener(
      'resize',
      () => {

        clearTimeout(resizeTimer);

        resizeTimer =
          setTimeout(render, 120);

      }
    );


    /*
     * 이미지 preload
     */

    for (
      let i = 1;
      i <= TOTAL_PAGES;
      i++
    ) {

      const img = new Image();

      img.src = pageSrc(i);

    }


    /*
     * 최초 렌더링
     */

    render();
