<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Gene JEONG</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3L72KGY0LK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

  <style>
    :root {
      --bg: #f6f5f1;
      --ink: #222;
      --muted: #8c8c8c;
      --paper: #fff;
      --shadow: 0 26px 80px rgba(0,0,0,0.16), 0 8px 22px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      background-image: url("https://www.transparenttextures.com/patterns/white-paper.png");
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      pointer-events: none;
    }
    .topbar a, .topbar .meta {
      pointer-events: auto;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #444;
    }
    .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 18px 102px;
      perspective: 2600px;
    }
    .book {
      position: relative;
      filter: drop-shadow(var(--shadow));
      transition: width .35s ease, height .35s ease;
      user-select: none;
    }
    .book.cover-mode {
      width: min(88vw, calc((100vh - 180px) * 0.707));
      height: min(78vh, calc((100vw - 36px) / 0.707));
      max-width: 595px;
      max-height: 842px;
    }
    .book.spread-mode {
      width: min(94vw, calc((100vh - 190px) * 1.414));
      height: min(76vh, calc((100vw - 36px) / 1.414));
      max-width: 1190px;
      max-height: 842px;
    }
    .cover-frame,
    .spread-frame {
      position: absolute;
      inset: 0;
    }
    .hidden { display: none !important; }
    .sheet {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--paper);
      overflow: hidden;
      backface-visibility: hidden;
    }
    .sheet img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #fff;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .cover-sheet {
      inset: 0;
      box-shadow: var(--shadow);
    }
    .left-page, .right-page {
      width: 50%;
      box-shadow: 0 14px 32px rgba(0,0,0,0.08);
    }
    .left-page { left: 0; }
    .right-page { right: 0; }
    .spread-frame::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 54px;
      background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.12) 20%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.12) 80%, rgba(0,0,0,0));
      filter: blur(9px);
      z-index: 8;
      pointer-events: none;
    }
    .spread-frame::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(80,80,80,0.38) 10%, rgba(55,55,55,0.5) 50%, rgba(80,80,80,0.38) 90%, rgba(255,255,255,0.95));
      box-shadow: -9px 0 18px rgba(0,0,0,0.08), 9px 0 18px rgba(0,0,0,0.08);
      z-index: 9;
      pointer-events: none;
    }
    .flip-layer {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      transform-style: preserve-3d;
      display: none;
    }
    .flip-layer.active { display: block; }
    .flip-layer.next { right: 0; transform-origin: left center; }
    .flip-layer.prev { left: 0; transform-origin: right center; }
    .flip-face {
      position: absolute;
      inset: 0;
      background: var(--paper);
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(0,0,0,0.18);
    }
    .flip-face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }
    .flip-face.back { transform: rotateY(180deg); }
    .flip-layer.next.active { animation: flipNext 0.9s cubic-bezier(.45,.08,.2,1) forwards; }
    .flip-layer.prev.active { animation: flipPrev 0.9s cubic-bezier(.45,.08,.2,1) forwards; }
    @keyframes flipNext {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-180deg); }
    }
    @keyframes flipPrev {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(180deg); }
    }
    .desktop-zones {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }
    .zone {
      position: absolute;
      top: 0; bottom: 0;
      width: 28vw;
      min-width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .zone:hover { opacity: 1; }
    .zone.left { left: 0; }
    .zone.right { right: 0; }
    .zone span {
      width: 56px; height: 56px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; color: #444;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .mobile-controls {
      display: none;
    }
    .mobile-controls button {
      border: 1px solid rgba(34,34,34,0.14);
      background: rgba(255,255,255,0.95);
      color: #222;
      border-radius: 999px;
      padding: 14px 20px;
      min-width: 136px;
      font-size: 13px;
      letter-spacing: 0.08em;
      box-shadow: 0 10px 26px rgba(0,0,0,0.10);
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-controls button:active { transform: translateY(1px) scale(0.99); }
    .hint {
      position: fixed;
      left: 50%; bottom: 24px;
      transform: translateX(-50%);
      z-index: 40;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      pointer-events: none;
      animation: fadeOut 5.5s ease forwards;
      animation-delay: 4s;
    }
    @keyframes fadeOut { to { opacity: 0; } }
    @media (max-width: 900px) {
      .stage { padding: 68px 10px 112px; }
      .book.cover-mode,
      .book.spread-mode {
        width: min(94vw, calc((100vh - 190px) * 0.707));
        height: min(76vh, calc((100vw - 20px) / 0.707));
        max-width: 595px;
        max-height: 842px;
      }
      .spread-frame::before, .spread-frame::after { display: none; }
      .left-page, .right-page, .flip-layer { width: 100%; left: 0; right: auto; }
      .right-page { display: none; }
      .flip-layer.next, .flip-layer.prev { left: 0; transform-origin: center center; }
      .flip-layer.next.active { animation: fadeSwap .5s ease forwards; }
      .flip-layer.prev.active { animation: fadeSwap .5s ease forwards; }
      @keyframes fadeSwap {
        from { opacity: 0.96; transform: translateX(0); }
        50%  { opacity: 0.7; }
        to   { opacity: 0; transform: translateX(0); }
      }
      .desktop-zones .zone { width: 36vw; }
      .mobile-controls {
        position: fixed;
        left: 14px; right: 14px; bottom: 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        z-index: 45;
      }
      .hint {
        bottom: 78px;
        width: calc(100vw - 32px);
        text-align: center;
        font-size: 11px;
      }
      .zone span { width: 44px; height: 44px; font-size: 28px; }
      .topbar { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← Retour</a>
    <div class="meta"><span id="pageCounter">1 / 41</span></div>
  </div>

  <div class="stage">
    <div class="book cover-mode" id="book">
      <div class="cover-frame" id="coverFrame">
        <div class="sheet cover-sheet"><img id="coverImg" alt="Portfolio cover"></div>
      </div>

      <div class="spread-frame hidden" id="spreadFrame">
        <div class="sheet left-page"><img id="leftImg" alt="Left page"></div>
        <div class="sheet right-page"><img id="rightImg" alt="Right page"></div>

        <div class="flip-layer next" id="flipNextLayer">
          <div class="flip-face front"><img id="flipNextFront" alt="Turning front page"></div>
          <div class="flip-face back"><img id="flipNextBack" alt="Turning back page"></div>
        </div>

        <div class="flip-layer prev" id="flipPrevLayer">
          <div class="flip-face front"><img id="flipPrevFront" alt="Turning previous page"></div>
          <div class="flip-face back"><img id="flipPrevBack" alt="Turning previous back page"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="desktop-zones" aria-hidden="true">
    <div class="zone left" id="prevZone"><span>‹</span></div>
    <div class="zone right" id="nextZone"><span>›</span></div>
  </div>

  <div class="mobile-controls" aria-label="Navigation mobile">
    <button id="prevButton" type="button">← PRÉCÉDENT</button>
    <button id="nextButton" type="button">SUIVANT →</button>
  </div>

  <div class="hint">← CLIQUEZ · GLISSEZ · FLÈCHES CLAVIER →</div>

  <script>
    /* ==============================================================
       EASY UPDATE
       1) pages 폴더 안에 page-01.jpg, page-02.jpg ... 형식으로 넣기
       2) 아래 TOTAL_PAGES 숫자만 실제 페이지 수로 바꾸기
       ============================================================== */
    const TOTAL_PAGES = 41;
    const FOLDER = 'pages/';
    const PREFIX = 'page-';
    const EXT = '.jpg';
    /* ============================================================== */

    const book = document.getElementById('book');
    const coverFrame = document.getElementById('coverFrame');
    const spreadFrame = document.getElementById('spreadFrame');
    const coverImg = document.getElementById('coverImg');
    const leftImg = document.getElementById('leftImg');
    const rightImg = document.getElementById('rightImg');
    const pageCounter = document.getElementById('pageCounter');
    const flipNextLayer = document.getElementById('flipNextLayer');
    const flipPrevLayer = document.getElementById('flipPrevLayer');
    const flipNextFront = document.getElementById('flipNextFront');
    const flipNextBack = document.getElementById('flipNextBack');
    const flipPrevFront = document.getElementById('flipPrevFront');
    const flipPrevBack = document.getElementById('flipPrevBack');

    let currentLeft = 1;
    let isAnimating = false;

    function pageSrc(n) {
      return FOLDER + PREFIX + String(n).padStart(2, '0') + EXT;
    }

    function isMobile() {
      return window.innerWidth <= 900;
    }

    function hasSpread() {
      return !isMobile() && currentLeft >= 2;
    }

    function setCounter() {
      if (currentLeft === 1 || isMobile()) {
        pageCounter.textContent = currentLeft + ' / ' + TOTAL_PAGES;
      } else {
        const right = Math.min(currentLeft + 1, TOTAL_PAGES);
        pageCounter.textContent = currentLeft + '–' + right + ' / ' + TOTAL_PAGES;
      }
    }

    function render() {
      coverImg.src = pageSrc(currentLeft);
      if (currentLeft === 1 || isMobile()) {
        book.classList.remove('spread-mode');
        book.classList.add('cover-mode');
        coverFrame.classList.remove('hidden');
        spreadFrame.classList.add('hidden');
      } else {
        book.classList.remove('cover-mode');
        book.classList.add('spread-mode');
        coverFrame.classList.add('hidden');
        spreadFrame.classList.remove('hidden');
        leftImg.src = pageSrc(currentLeft);
        rightImg.src = pageSrc(Math.min(currentLeft + 1, TOTAL_PAGES));
      }
      setCounter();
    }

    function nextTarget() {
      if (currentLeft === 1) return 2;
      return currentLeft + 2 <= TOTAL_PAGES ? currentLeft + 2 : currentLeft;
    }

    function prevTarget() {
      if (currentLeft <= 1) return 1;
      if (currentLeft === 2) return 1;
      return Math.max(2, currentLeft - 2);
    }

    function animateNextDesktop(targetLeft) {
      flipNextFront.src = pageSrc(currentLeft + 1);
      flipNextBack.src = pageSrc(targetLeft);
      flipNextLayer.classList.remove('active');
      void flipNextLayer.offsetWidth;
      flipNextLayer.classList.add('active');
      setTimeout(() => {
        flipNextLayer.classList.remove('active');
        currentLeft = targetLeft;
        render();
        isAnimating = false;
      }, 900);
    }

    function animatePrevDesktop(targetLeft) {
      flipPrevFront.src = pageSrc(currentLeft);
      flipPrevBack.src = pageSrc(targetLeft + 1);
      flipPrevLayer.classList.remove('active');
      void flipPrevLayer.offsetWidth;
      flipPrevLayer.classList.add('active');
      setTimeout(() => {
        flipPrevLayer.classList.remove('active');
        currentLeft = targetLeft;
        render();
        isAnimating = false;
      }, 900);
    }

    function next() {
      if (isAnimating) return;
      const targetLeft = nextTarget();
      if (targetLeft === currentLeft) return;
      isAnimating = true;
      if (isMobile()) {
        currentLeft = currentLeft === 1 ? 2 : Math.min(currentLeft + 1, TOTAL_PAGES);
        render();
        isAnimating = false;
        return;
      }
      if (currentLeft === 1) {
        currentLeft = 2;
        render();
        isAnimating = false;
        return;
      }
      animateNextDesktop(targetLeft);
    }

    function prev() {
      if (isAnimating) return;
      const targetLeft = prevTarget();
      if (targetLeft === currentLeft) return;
      isAnimating = true;
      if (isMobile()) {
        currentLeft = Math.max(1, currentLeft - 1);
        render();
        isAnimating = false;
        return;
      }
      if (currentLeft === 2) {
        currentLeft = 1;
        render();
        isAnimating = false;
        return;
      }
      animatePrevDesktop(targetLeft);
    }

    document.getElementById('nextZone').addEventListener('click', next);
    document.getElementById('prevZone').addEventListener('click', prev);
    document.getElementById('nextButton').addEventListener('click', next);
    document.getElementById('prevButton').addEventListener('click', prev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    });

    let touchStartX = null;
    let touchStartY = null;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      const threshold = isMobile() ? 24 : 42;
      if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy) * 1.15) {
        if (dx < 0) next(); else prev();
      }
      touchStartX = null;
      touchStartY = null;
    }, { passive: true });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    });

    // preload
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const img = new Image();
      img.src = pageSrc(i);
    }

    render();
  </script>
