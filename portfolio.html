<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Gene JEONG</title>

  <style>
    :root {
      --bg: #f6f5f1;
      --ink: #222;
      --muted: #8c8c8c;
      --paper: #fff;
      --shadow: 0 24px 80px rgba(0,0,0,0.16), 0 8px 22px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      background-image: url("https://www.transparenttextures.com/patterns/white-paper.png");
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      pointer-events: none;
    }
    .topbar a, .topbar .meta {
      pointer-events: auto;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #444;
    }
    .meta {
      display: flex;
      gap: 14px;
      align-items: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 96px;
    }
    .flipbook-shell {
      position: relative;
      width: min(94vw, calc((100vh - 170px) * 1.414));
      height: min(78vh, calc((100vw - 48px) / 1.414));
      max-width: 1190px;
      max-height: 842px;
      filter: drop-shadow(0 26px 48px rgba(0,0,0,0.15));
    }
    .flipbook-shell.spread::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.13) 20%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.13) 80%, rgba(0,0,0,0));
      filter: blur(9px);
      z-index: 30;
      pointer-events: none;
      opacity: 0.9;
    }
    .flipbook-shell.spread::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(80,80,80,0.38) 12%, rgba(55,55,55,0.5) 50%, rgba(80,80,80,0.38) 88%, rgba(255,255,255,0.9));
      box-shadow: -9px 0 18px rgba(0,0,0,0.08), 9px 0 18px rgba(0,0,0,0.08);
      z-index: 31;
      pointer-events: none;
    }
    #flipbook {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .page {
      background: var(--paper);
      overflow: hidden;
    }
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .desktop-zones {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28vw;
      min-width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .zone:hover { opacity: 1; }
    .zone.left { left: 0; }
    .zone.right { right: 0; }
    .zone span {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #444;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .mobile-controls {
      display: none;
    }
    .mobile-controls button {
      border: 1px solid rgba(34,34,34,0.14);
      background: rgba(255,255,255,0.95);
      color: #222;
      border-radius: 999px;
      padding: 14px 20px;
      min-width: 136px;
      font-size: 13px;
      letter-spacing: 0.08em;
      box-shadow: 0 10px 26px rgba(0,0,0,0.10);
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-controls button:active {
      transform: translateY(1px) scale(0.99);
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 40;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      pointer-events: none;
      animation: fadeOut 5.5s ease forwards;
      animation-delay: 4s;
    }
    @keyframes fadeOut { to { opacity: 0; } }
    @media (max-width: 900px) {
      .stage { padding: 68px 10px 112px; }
      .flipbook-shell {
        width: min(94vw, calc((100vh - 180px) * 0.707));
        height: min(76vh, calc((100vw - 20px) / 0.707));
        max-width: 595px;
        max-height: 842px;
      }
      .desktop-zones .zone { width: 36vw; }
      .mobile-controls {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        z-index: 45;
      }
      .hint {
        bottom: 78px;
        width: calc(100vw - 32px);
        text-align: center;
        font-size: 11px;
      }
      .flipbook-shell.spread::before { width: 30px; filter: blur(6px); }
      .flipbook-shell.spread::after { box-shadow: -6px 0 12px rgba(0,0,0,0.07), 6px 0 12px rgba(0,0,0,0.07); }
      .zone span { width: 44px; height: 44px; font-size: 28px; }
      .meta { gap: 8px; font-size: 12px; }
      .topbar { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← Retour</a>
    <div class="meta">
      <span id="pageCounter">1 / 41</span>
    </div>
  </div>

  <div class="stage">
    <div class="flipbook-shell" id="shell">
      <div id="flipbook"></div>
    </div>
  </div>

  <div class="desktop-zones" aria-hidden="true">
    <div class="zone left" id="prevZone"><span>‹</span></div>
    <div class="zone right" id="nextZone"><span>›</span></div>
  </div>

  <div class="mobile-controls" aria-label="Navigation mobile">
    <button id="prevButton" type="button">← PRÉCÉDENT</button>
    <button id="nextButton" type="button">SUIVANT →</button>
  </div>

  <div class="hint">← CLIQUEZ · GLISSEZ · FLÈCHES CLAVIER →</div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <script>
    /* ==============================================================
       EASY UPDATE
       1) pages 폴더 안에 page-01.jpg, page-02.jpg ... 형식으로 넣기
       2) 아래 TOTAL_PAGES 숫자만 실제 페이지 수로 바꾸기
       ============================================================== */
    const TOTAL_PAGES = 41;
    const FOLDER = 'pages/';
    const PREFIX = 'page-';
    const EXT = '.jpg';
    /* ============================================================== */

    const flipbookEl = document.getElementById('flipbook');
    const shell = document.getElementById('shell');
    const pageCounter = document.getElementById('pageCounter');
    const DESKTOP_BREAKPOINT = 900;
    let pageFlip = null;
    let currentIndex = 0;
    let portraitMode = window.innerWidth <= DESKTOP_BREAKPOINT;

    function buildPages() {
      flipbookEl.innerHTML = '';
      const items = [];
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const page = document.createElement('div');
        page.className = 'page';
        const img = document.createElement('img');
        img.alt = 'Portfolio page ' + i;
        img.src = FOLDER + PREFIX + String(i).padStart(2, '0') + EXT;
        page.appendChild(img);
        flipbookEl.appendChild(page);
        items.push(page);
      }
      return items;
    }

    function counterLabel(index, orientation) {
      if (orientation === 'landscape' && index > 0) {
        const left = index + 1;
        const right = Math.min(index + 2, TOTAL_PAGES);
        return left + '–' + right + ' / ' + TOTAL_PAGES;
      }
      return (index + 1) + ' / ' + TOTAL_PAGES;
    }

    function updateUI() {
      if (!pageFlip) return;
      const index = pageFlip.getCurrentPageIndex();
      const orientation = pageFlip.getOrientation();
      currentIndex = index;
      pageCounter.textContent = counterLabel(index, orientation);
      if (orientation === 'landscape' && index > 0) shell.classList.add('spread');
      else shell.classList.remove('spread');
    }

    function createFlipbook(startIndex = 0) {
      portraitMode = window.innerWidth <= DESKTOP_BREAKPOINT;
      if (pageFlip) pageFlip.destroy();
      const items = buildPages();
      pageFlip = new St.PageFlip(flipbookEl, {
        width: 595,
        height: 842,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 1200,
        minHeight: 396,
        maxHeight: 1700,
        maxShadowOpacity: 0.34,
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: true,
        swipeDistance: 24,
        usePortrait: portraitMode,
        startZIndex: 10,
        autoSize: true,
        drawShadow: true,
        flippingTime: 900
      });
      pageFlip.loadFromHTML(items);
      pageFlip.on('flip', updateUI);
      pageFlip.on('changeOrientation', updateUI);
      if (startIndex > 0) pageFlip.turnToPage(startIndex);
      setTimeout(updateUI, 120);
    }

    const next = () => pageFlip && pageFlip.flipNext();
    const prev = () => pageFlip && pageFlip.flipPrev();

    document.getElementById('nextZone').addEventListener('click', next);
    document.getElementById('prevZone').addEventListener('click', prev);
    document.getElementById('nextButton').addEventListener('click', next);
    document.getElementById('prevButton').addEventListener('click', prev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newPortraitMode = window.innerWidth <= DESKTOP_BREAKPOINT;
        if (newPortraitMode !== portraitMode) createFlipbook(currentIndex);
        else updateUI();
      }, 140);
    });

    createFlipbook(0);
  </script>
